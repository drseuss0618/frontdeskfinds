<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" role="img" aria-label="How we review: read vendor pages, date every price, disclose our own service, fix mistakes"><rect width="960" height="210" rx="18" fill="#f1f7f6" stroke="#cfe0de" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><circle cx="120" cy="70" r="30" fill="#f2b84b"/><text x="120" y="82" font-size="30" font-weight="800" fill="#17302e">1</text><text x="120" y="140" font-size="21" font-weight="700" fill="#1f5f5b">Read vendor pages</text><text x="120" y="168" font-size="17" fill="#4d6b69">not sales claims</text><circle cx="360" cy="70" r="30" fill="#f2b84b"/><text x="360" y="82" font-size="30" font-weight="800" fill="#17302e">2</text><text x="360" y="140" font-size="21" font-weight="700" fill="#1f5f5b">Date every price</text><text x="360" y="168" font-size="17" fill="#4d6b69">so you know how fresh</text><circle cx="600" cy="70" r="30" fill="#f2b84b"/><text x="600" y="82" font-size="30" font-weight="800" fill="#17302e">3</text><text x="600" y="140" font-size="21" font-weight="700" fill="#1f5f5b">Disclose our service</text><text x="600" y="168" font-size="17" fill="#4d6b69">we sell one too</text><circle cx="840" cy="70" r="30" fill="#f2b84b"/><text x="840" y="82" font-size="30" font-weight="800" fill="#17302e">4</text><text x="840" y="140" font-size="21" font-weight="700" fill="#1f5f5b">Fix mistakes</text><text x="840" y="168" font-size="17" fill="#4d6b69">and say what changed</text></g></svg>