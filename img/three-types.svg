<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="Live answering services, AI receptionists, and phone systems"><rect width="960" height="200" rx="18" fill="#174a47"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="30" y="35" width="280" height="130" rx="16" fill="#1f5f5b" stroke="#f2b84b" stroke-width="3"/><text x="170" y="88" font-size="24" font-weight="800" fill="#f2b84b">Live answering</text><text x="170" y="124" font-size="19" fill="#fff">real people take the call</text><rect x="340" y="35" width="280" height="130" rx="16" fill="#1f5f5b" stroke="#f2b84b" stroke-width="3"/><text x="480" y="88" font-size="24" font-weight="800" fill="#f2b84b">AI receptionist</text><text x="480" y="124" font-size="19" fill="#fff">software answers and takes details</text><rect x="650" y="35" width="280" height="130" rx="16" fill="#1f5f5b" stroke="#f2b84b" stroke-width="3"/><text x="790" y="88" font-size="24" font-weight="800" fill="#f2b84b">Phone system</text><text x="790" y="124" font-size="19" fill="#fff">routing, voicemail, texting</text></g></svg>